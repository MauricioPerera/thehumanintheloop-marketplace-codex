name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate marketplace and plugin structure
        run: python plugins/marketplace-validator/scripts/validate_marketplace.py .
      - name: Validate JSON manifests
        shell: bash
        run: |
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          find plugins -path '*/.claude-plugin/plugin.json' -o -path '*/.codex-plugin/plugin.json' | while read file; do python -m json.tool "$file" >/dev/null; done
      - name: Check catalog JavaScript
        run: node --check docs/app.js
      - name: Check catalog SEO metadata
        run: python scripts/validate_catalog_metadata.py
